name: Build Luminescent Platinum iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build Maxwell to MSL shader translator
      run: |
        mkdir -p work
        clang -O3 -c shader_translator/translate.c -o work/translate.o

    - name: Generate 32-bit C sources
      run: |
        python3 scripts/recomp/ios/gen32.sh

    - name: Compile game chunks for iOS
      run: |
        bash scripts/recomp/ios/compile_chunk_ios.sh

    - name: Build final iOS App binary
      run: |
        bash scripts/recomp/ios/build_rt32.sh

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r work/Payload/Strahlender.app Payload/
        zip -r LuminescentPlatinum.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: LuminescentPlatinum-IPA
        path: LuminescentPlatinum.ipa